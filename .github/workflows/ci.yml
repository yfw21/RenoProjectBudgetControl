name: CI

on:
  pull_request:
  push:
    branches: [main, azure]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build API
        run: dotnet build BudgetApi -c Release
      - name: Unit tests
        run: dotnet test tests/BudgetApi.Tests

      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Type-check and build web
        working-directory: web
        run: npm ci && npm run build

      - name: Lint infrastructure
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      # Integration test against the same services the app uses in Azure:
      # SQL Server engine (Azure SQL) and Azurite (Blob Storage), via docker compose.
      - name: Start app + SQL Server + Azurite
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: API smoke test
        run: scripts/smoke-api.sh http://localhost:8080
      - name: App logs on failure
        if: failure()
        run: docker compose logs app
