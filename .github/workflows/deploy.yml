name: Deploy to Azure

# Runs after CI passes on main. Signs in to Azure with OpenID Connect (federated credential),
# so no Azure password or secret is stored in GitHub. One-time setup: docs/AZURE.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: deploy-production

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR: ${{ vars.AZURE_ACR_NAME }}
      APP: ca-renobudget
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.workflow_run.head_sha || github.sha }}' }

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in Azure Container Registry
        run: |
          TAG=$(git rev-parse --short HEAD)
          az acr build -r "$ACR" -t "renobudget:$TAG" . --no-logs -o none
          echo "IMAGE=$(az acr show -n "$ACR" --query loginServer -o tsv)/renobudget:$TAG" >> "$GITHUB_ENV"

      - name: Roll out new revision
        run: az containerapp update -g "$RG" -n "$APP" --image "$IMAGE" -o none

      - name: Smoke test production
        run: |
          URL="https://$(az containerapp show -g "$RG" -n "$APP" --query properties.configuration.ingress.fqdn -o tsv)"
          for _ in $(seq 1 40); do curl -fs -o /dev/null --max-time 10 "$URL/healthz/ready" && break; sleep 6; done
          scripts/smoke-api.sh "$URL"
